[package]
name = "gray-search"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Web search tools (web_search, web_fetch) and /search for Gray agents."

[dependencies]
anyhow = "1"
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = { version = "2", features = ["serde"] }

[[bin]]
name = "gray-search"
path = "src/main.rs"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
